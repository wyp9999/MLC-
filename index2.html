<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网页效果复刻</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 顶部公告 -->
    <div class="top-notice">
             🏆J9九游会真人游戏第一品牌.FIBA全球顶级合作伙伴.
    </div>

    <!-- 主体容器 -->
    <div class="main-container">
        
        <!-- 上部：Banner + 右侧卡片 -->
        <div class="top-section">
            <!-- 左侧大 Banner -->
            <div class="hero-banner">
                <div class="banner-content">
                    <h2>PA.J9九游会</h2>
                    <p> 新人首存赠送40% </p>
                    <a href="https://www.968j9.com" target="_blank" style="text-decoration: none; display: block;">
                        <button class="btn">注册 / 登录 ➤</button>
                    </a>
                </div>
                <!-- 注：这里通常用一张带透明背景的 PNG 人物图定位在右侧 -->
                <div class="banner-image-placeholder">人物/足球图片</div>
            </div>

            <!-- 右侧双卡片 -->
            <div class="side-cards">
                <div class="side-card glass-effect">
    <img src="mmexport1792255596540.jpg" class="full-img" alt="星空体育">
</div>
<div class="side-card glass-effect">
    <img src="mmexport1792255591051.jpg" class="full-img" alt="九游娱乐">
</div>
            
                    </div>
                </div>
            </div>
        </div>

        <!-- 下部：列表区 -->
        <div class="list-section">
            <div class="list-item glass-effect">
                <div class="item-logo"> </div>
                <div class="item-content">
                    <h3>百家乐</h3>
                    <p>第五届百家乐世锦赛赛制全面升级 </p>
                    <p class="desc"></p>
                </div>
                <div class="item-arrow">></div>
            </div>

            <div class="list-item glass-effect">
                <div class="item-logo"></div>
                <div class="item-content">
                    <h3>海量电游</h3>
                    <p> 电子洗码 1.0% 无限洗码.随时结算 </p>
                    <p class="desc"></p>
                </div>
                <div class="item-arrow">></div>
            </div>
        </div>

    </div>
</body>
</html>
