<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!-- 这是你刚上传的图片，点击会跳转 -->
<a href="http://www.968j9.com" target="_blank">
  <img src="banner.jpg" alt="J9娱乐" style="width: 100%; max-width: 600px; border-radius: 12px; margin-bottom: 24px;">
</a>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>26.vg</title>
  <style>
    :root {
      --bg: #080b12; --text: #f2f5ff; --muted: #9aa4b8;
      --line: rgba(255, 255, 255, 0.14); --accent: #6ee7ff; --accent2: #a78bfa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text); background: radial-gradient(900px 520px at 18% -15%, rgba(110, 231, 255, 0.20), transparent 62%), radial-gradient(820px 520px at 88% 6%, rgba(167, 139, 250, 0.20), transparent 62%), var(--bg);
      min-height: 100vh; display: flex; flex-direction: column;
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none;
      background-image: linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 64px 64px; mask-image: radial-gradient(ellipse at 50% 40%, #000 20%, transparent 78%);
      -webkit-mask-image: radial-gradient(ellipse at 50% 40%, #000 20%, transparent 78%);
    }
    .page { position: relative; z-index: 1; width: min(760px, 100%); margin: auto; padding: 40px 24px; display: flex; flex-direction: column; align-items: flex-start; }
    .brand { font-size: 15px; font-weight: 700; letter-spacing: 0.16em; color: var(--muted); margin-bottom: 44px; animation: rise 0.7s ease both; }
    .brand b { color: var(--text); }
    h1 { font-size: clamp(38px, 8vw, 76px); line-height: 1.02; letter-spacing: -0.045em; font-weight: 850; margin-bottom: 22px; max-width: 15em; animation: rise 0.7s 0.06s ease both; }
    h1 em { font-style: normal; background: linear-gradient(96deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .lead { font-size: clamp(16px, 2.3vw, 19px); line-height: 1.75; color: var(--muted); max-width: 34em; margin-bottom: 38px; animation: rise 0.7s 0.12s ease both; }
    .cta { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; animation: rise 0.7s 0.18s ease both; }
    .btn-main { display: inline-flex; align-items: center; gap: 10px; padding: 15px 26px; border-radius: 999px; font-size: 16px; font-weight: 700; color: #071018; text-decoration: none; border: none; cursor: pointer; font-family: inherit; background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 12px 34px -12px rgba(110, 231, 255, 0.6); transition: transform 0.2s ease; }
    .btn-main:hover { transform: translateY(-2px); }
    .btn-ghost { display: inline-flex; align-items: center; gap: 8px; padding: 15px 22px; border-radius: 999px; font-size: 15px; font-weight: 600; color: var(--text); background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line); cursor: pointer; font-family: inherit; transition: background 0.2s ease; }
    .links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; animation: rise 0.7s 0.24s ease both; }
    .link { display: inline-flex; align-items: center; gap: 7px; padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--muted); text-decoration: none; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.03); transition: 0.2s; }
    .link:hover { color: var(--text); border-color: rgba(110, 231, 255, 0.45); transform: translateY(-2px); }
    .link i { font-style: normal; font-size: 12px; color: var(--accent); opacity: 0.85; }
    .foot { position: relative; z-index: 1; width: min(760px, 100%); margin: 0 auto; padding: 0 24px 34px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--muted); animation: rise 0.7s 0.3s ease both; }
    .foot a { color: var(--muted); text-decoration: none; }
    .modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 24px; }
    .modal[hidden] { display: none; }
    .modal-backdrop { position: absolute; inset: 0; background: rgba(4, 7, 12, 0.72); backdrop-filter: blur(10px); opacity: 0; transition: opacity 0.22s ease; }
    .modal-card { position: relative; width: min(340px, 100%); padding: 26px 24px 22px; border-radius: 24px; border: 1px solid var(--line); background: linear-gradient(180deg, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0.045)); box-shadow: 0 40px 90px -30px rgba(0, 0, 0, 0.9); text-align: center; opacity: 0; transform: translateY(12px) scale(0.97); transition: 0.22s; }
    .modal.open .modal-backdrop { opacity: 1; }
    .modal.open .modal-card { opacity: 1; transform: none; }
    .modal-close { position: absolute; top: 12px; right: 12px; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.06); color: var(--muted); cursor: pointer; }
    .modal-card h2 { font-size: 18px; font-weight: 750; margin-bottom: 6px; }
    .modal-tip { font-size: 13px; color: var(--muted); margin-bottom: 18px; }
    .fake-qr { width: 100%; aspect-ratio: 1 / 1; border-radius: 16px; background: rgba(0,0,0,0.2); border: 1px dashed rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; margin-bottom: 16px; padding: 20px; text-align: center; }
    .wechat-id { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: rgba(0,0,0,0.3); padding: 10px 16px; border-radius: 12px; border: 1px solid var(--line); }
    .wechat-id span { font-family: monospace; color: var(--text); font-size: 15px; font-weight: bold; }
    .wechat-id button { padding: 6px 12px; border-radius: 99px; border: none; background: var(--accent); color: #000; font-size: 12px; font-weight: bold; cursor: pointer; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 560px) {
      .page { padding: 32px 20px; } .brand { margin-bottom: 32px; } .cta { width: 100%; flex-direction: column; align-items: stretch; } .btn-main, .btn-ghost { justify-content: center; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="brand"><b></b></div>
    <h1>把想法做成<em>能玩的东西</em>。</h1>
    <p class="lead">26.vg 是一个独立开发者的落脚点。游戏、工具、实验，做完就放在这里。</p>
    <div class="cta">
      <button class="btn-main" id="openWechat" type="button">加微信 <span>→</span></button>
      <button class="btn-ghost" id="copyEmail" type="button">复制邮箱</button>
    </div>
    <nav class="links">
      <a class="link" href="https://github.com/wyp9999" target="_blank">GitHub <i>↗</i></a>
      <a class="link" href="https://x.com/" target="_blank">X (推特) <i>↗</i></a>
    </nav>
  </main>
  
  <footer class="foot">
    <div>© <span id="year"></span> 26.vg</div>
    <div><a href="mailto:hello@26.vg">hello@26.vg</a></div>
  </footer>

  <div class="modal" id="wechatModal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card" role="dialog" aria-modal="true" tabindex="-1">
      <button class="modal-close" type="button" data-close aria-label="关闭">✕</button>
      <h2>加我微信</h2>
      <p class="modal-tip">备注「26.vg」</p>
      <div class="fake-qr">二维码占位<br>以后可以换成图片</div>
      <div class="wechat-id">
        <span>wyp9999</span> 
        <button type="button" id="copyWechat">复制</button>
      </div>
    </div>
  </div>

  <script>
    async function copyText(text) {
      try { await navigator.clipboard.writeText(text); return true; } 
      catch { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); return true; }
    }
    document.getElementById("year").textContent = new Date().getFullYear();
    document.getElementById("copyEmail").addEventListener("click", async function () {
      await copyText("hello@26.vg");
      const old = this.textContent; this.textContent = "已复制 ✓";
      setTimeout(() => this.textContent = old, 1500);
    });
    const modal = document.getElementById("wechatModal");
    const card = modal.querySelector(".modal-card");
    document.getElementById("openWechat").addEventListener("click", () => {
      modal.hidden = false; document.body.style.overflow = "hidden";
      requestAnimationFrame(() => modal.classList.add("open"));
      card.focus();
    });
    modal.querySelectorAll("[data-close]").forEach(el => el.addEventListener("click", () => {
      modal.classList.remove("open"); document.body.style.overflow = "";
      setTimeout(() => modal.hidden = true, 220);
    }));
    document.getElementById("copyWechat").addEventListener("click", async function () {
      await copyText("wyp9999");
      const old = this.textContent; this.textContent = "已复制";
      setTimeout(() => this.textContent = old, 1500);
    });
  </script>
</body>
</html>
